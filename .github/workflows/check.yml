name: Assignment 4 checks

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  java-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Show toolchain
        run: |
          java -version
          python --version
      - name: Compile and run official public checks
        run: |
          python tools/run.py --setup
          python tools/run.py --check
      - name: Run additional student tests
        run: python tests/student/smoke_tests.py
